    body {
        margin: 0;
        min-height: 100vh;
        background-color: var(--hud-bg);
        color: var(--text-main);

        overflow-x: hidden;
        display: flex;
        flex-direction: column;
        align-items: center;
    }

    /* --- BACKGROUND GRID EFFECT --- */
    .grid-bg {
        position: fixed;
        top: 0; left: 0; width: 100vw; height: 100vh;
        background-image: 
            linear-gradient(to right, rgba(6, 182, 212, 0.1) 1px, transparent 1px),
            linear-gradient(to bottom, rgba(6, 182, 212, 0.1) 1px, transparent 1px);
        background-size: 40px 40px;
        transform: perspective(500px) rotateX(20deg) scale(1.5);
        transform-origin: top center;
        z-index: -2;
        animation: gridMove 20s linear infinite;
        opacity: 0.3;
        pointer-events: none;
    }
    
    @keyframes gridMove {
        0% { background-position: 0 0; }
        100% { background-position: 0 40px; }
    }

    /* Scanline Overlay */
    .scanlines {
        position: fixed; top: 0; left: 0; width: 100%; height: 100%;
        background: linear-gradient(to bottom, transparent 50%, var(--scanline-color) 51%);
        background-size: 100% 4px;
        z-index: 900;
        pointer-events: none;
    }

    /* --- CUSTOM CURSOR --- */
    #cursor-dot {
        width: 8px; height: 8px; background: var(--holo-cyan); border-radius: 50%;
        position: fixed; z-index: 10001; pointer-events: none;
        box-shadow: 0 0 10px var(--holo-cyan);
    }
    #cursor-ring {
        width: 40px; height: 40px; border: 2px solid var(--holo-cyan); border-radius: 50%;
        position: fixed; z-index: 10000; pointer-events: none;
        transition: width 0.2s, height 0.2s;
        transform: translate(-50%, -50%);
        display: flex; align-items: center; justify-content: center;
    }
    #cursor-ring::after { content: ''; width: 4px; height: 4px; background: var(--holo-cyan); position: absolute; bottom: -6px; }

    /* --- LAYOUT --- */
    .hud-container {
        width: 95%; max-width: 1400px;
        display: grid; grid-template-columns: 1fr 350px;
        gap: 30px; padding: 20px 0;
        flex-grow: 1; z-index: 1;
    }

    @media (max-width: 900px) { .hud-container { grid-template-columns: 1fr; } }

    /* --- HEADER --- */
    header {
        width: 100%; padding: 20px 40px;
        display: flex; justify-content: space-between; align-items: center;
        background: rgba(2, 6, 23, 0.9);
        border-bottom: 2px solid var(--holo-blue);
        box-shadow: 0 0 20px rgba(59, 130, 246, 0.2);
        z-index: 10;
        clip-path: polygon(0 0, 100% 0, 100% 85%, 98% 100%, 2% 100%, 0 85%);
    }

    .brand-section { display: flex; flex-direction: column; }
    .title-large {
        font-family: var(--font-tech);
        font-size: 2rem; font-weight: 900;
        color: white; text-transform: uppercase; letter-spacing: 4px;
        text-shadow: 0 0 10px var(--holo-cyan);
    }
    .sub-brand {
        color: var(--holo-cyan); font-size: 0.9rem; letter-spacing: 2px; font-weight: bold;
        display: flex; align-items: center; gap: 10px;
    }
    .status-dot { width: 8px; height: 8px; background: var(--success-green); border-radius: 50%; box-shadow: 0 0 8px var(--success-green); animation: blink 2s infinite; }
    
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

    /* --- PANELS (Tech Look) --- */
    .tech-panel {
        background: var(--hud-panel);
        border: 1px solid var(--hud-border);
        position: relative;
        padding: 25px;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }
    
    /* Decorative Corners */
    .tech-panel::before {
        content: ''; position: absolute; top: -1px; left: -1px; width: 20px; height: 20px;
        border-top: 3px solid var(--holo-cyan); border-left: 3px solid var(--holo-cyan);
    }
    .tech-panel::after {
        content: ''; position: absolute; bottom: -1px; right: -1px; width: 20px; height: 20px;
        border-bottom: 3px solid var(--holo-cyan); border-right: 3px solid var(--holo-cyan);
    }

    /* --- SIDEBAR --- */
    .sidebar { display: flex; flex-direction: column; gap: 20px; }
    
    .data-row { display: flex; justify-content: space-between; margin-bottom: 8px; font-family: var(--font-tech); font-size: 0.9rem; }
    .data-val { color: var(--holo-cyan); font-weight: bold; }

    /* PET HOLOGRAM */

        width: 160px; height: 160px; margin: 0 auto;

        background: radial-gradient(circle, rgba(6, 182, 212, 0.1) 0%, transparent 70%);

        display: flex; align-items: center; justify-content: center;

        animation: spin 4s linear infinite;

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    /* --- MENU BUTTONS (Angled) --- */
    .grid-menu { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; width: 100%; }

    .tech-btn {

        border: 1px solid var(--holo-cyan);
        color: var(--holo-cyan);
        padding: 20px;
        font-family: var(--font-tech);
        font-size: 1.1rem;
        font-weight: bold;
        text-transform: uppercase;
        cursor: none;
        position: relative;
        transition: 0.3s;
        clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
    }
    .tech-btn:hover {
        background: var(--holo-cyan);
        color: #000;
        box-shadow: 0 0 20px var(--holo-cyan);
        transform: translateY(-2px);
    }
    .tech-btn.danger { border-color: var(--alert-red); color: var(--alert-red); background: rgba(239, 68, 68, 0.1); }
    .tech-btn.danger:hover { background: var(--alert-red); color: white; box-shadow: 0 0 20px var(--alert-red); }

    /* --- QUESTION UI --- */
    .q-display { font-size: 1.4rem; line-height: 1.6; margin-bottom: 30px; border-left: 4px solid var(--holo-cyan); padding-left: 20px; }
    
    .opt-btn {
        width: 100%; padding: 15px 20px; margin-bottom: 12px;
        background: transparent;
        border: 1px solid var(--hud-border);
        border-left: 4px solid var(--hud-border);
        color: var(--text-dim);
        font-size: 1rem;
        text-align: left;
        transition: 0.2s;
        display: flex; align-items: center;
        font-family: 'Segoe UI', sans-serif;
    }
    .opt-btn:hover:not(:disabled) {
        border-color: var(--holo-cyan);
        border-left-color: var(--holo-cyan);
        background: rgba(6, 182, 212, 0.05);
        color: white;

    }
    .opt-btn.correct { border-color: var(--success-green); background: rgba(16, 185, 129, 0.1); color: var(--success-green); }
    .opt-btn.wrong { border-color: var(--alert-red); background: rgba(239, 68, 68, 0.1); color: var(--alert-red); opacity: 0.6; }

    .clue-box {
        position: absolute; bottom: 20px; right: 20px;
        background: rgba(0,0,0,0.9); border: 1px solid var(--gold);

        box-shadow: 0 0 10px rgba(234, 179, 8, 0.3);
        transform: scale(1.1);
    }

    /* SETTINGS INPUTS */
    select, input {
        background: #020617; border: 1px solid var(--holo-blue); color: var(--holo-cyan);
        padding: 5px; font-family: var(--font-tech); width: 100%; margin-top: 5px;
    }
</style>

        {id: 71, q: "Pyrosis is the medical term for:", a: "Heartburn", opts: ["Vomiting", "Diarrhea", "Belching"]},
        {id: 72, q: "Hematemesis refers to:", a: "Vomiting blood", opts: ["Blood in stool", "Coughing blood", "Nose bleed"]},
        {id: 73, q: "Hematemesis may indicate:", a: "Stomach/Duodenal ulcers or varices", opts: ["Appendicitis", "Cholecystitis", "Kidney stones"]},
        {id: 74, q: "Anorexia is defined as:", a: "Loss of appetite", opts: ["Excessive eating", "Weight gain", "Nausea"]},
        {id: 75, q: "The Liver is located in the:", a: "Right Upper Quadrant (RUQ)", opts: ["RLQ", "LUQ", "LLQ"]},
        {id: 76, q: "The Appendix is located in the:", a: "Right Lower Quadrant (RLQ)", opts: ["RUQ", "LUQ", "LLQ"]},
        {id: 77, q: "The Spleen is located in the:", a: "Left Upper Quadrant (LUQ)", opts: ["RUQ", "RLQ", "LLQ"]},
        {id: 78, q: "The correct sequence for Abdominal examination is:", a: "Inspection, Auscultation, Percussion, Palpation", opts: ["Inspection, Palpation, Percussion, Auscultation", "Palpation, Inspection, Auscultation, Percussion", "Auscultation, Inspection, Palpation, Percussion"]},
        {id: 79, q: "Why is Auscultation done before Palpation in the abdomen?", a: "To avoid altering bowel sounds", opts: ["It is less painful", "It is faster", "No specific reason"]},
        {id: 80, q: "Normal bowel sounds occur at a rate of:", a: "5-30 per minute", opts: ["< 5 per minute", "> 30 per minute", "Constant sound"]},
        {id: 81, q: "Hyperactive bowel sounds are defined as:", a: "> 30 per minute (Loud/Rushing)", opts: ["Silent", "< 5 per minute", "Soft/Low pitched"]},
        {id: 82, q: "Hypoactive bowel sounds are defined as:", a: "< 5 per minute", opts: ["> 30 per minute", "Continuous", "Musical"]},
        {id: 83, q: "Hypoactive sounds may occur after:", a: "Abdominal surgery or peritonitis", opts: ["Eating a large meal", "Diarrhea", "Laxative use"]},
        {id: 84, q: "Which percussion sound is predominant over the stomach and intestines?", a: "Tympany", opts: ["Dullness", "Resonance", "Flatness"]},
        {id: 85, q: "Which percussion sound is heard over solid organs like the liver/spleen?", a: "Dullness", opts: ["Tympany", "Hyperresonance", "Resonance"]},
        {id: 86, q: "Normal liver span in adults is:", a: "6-12 cm", opts: ["2-4 cm", "15-20 cm", "Same as spleen"]},
        {id: 87, q: "Splenic dullness should not be wider than:", a: "7 cm", opts: ["12 cm", "15 cm", "2 cm"]},
        {id: 88, q: "Costovertebral Angle (CVA) tenderness assesses the:", a: "Kidneys", opts: ["Liver", "Spleen", "Appendix"]},
        {id: 89, q: "CVA tenderness is checked at which rib level?", a: "12th rib", opts: ["5th rib", "1st rib", "Clavicle"]},
        {id: 90, q: "Deep palpation of the abdomen is depressed approx:", a: "5-8 cm", opts: ["1 cm", "10-15 cm", "Surface only"]},
        {id: 91, q: "Inspiratory Arrest (Murphy Sign) indicates:", a: "Cholecystitis (Gallbladder inflammation)", opts: ["Appendicitis", "Pancreatitis", "Gastritis"]},
        {id: 92, q: "The umbilicus should normally be:", a: "Midline and inverted", opts: ["Deviated and everted", "Red and swollen", "Blue"]},
        {id: 93, q: "Flexion is defined as:", a: "Bending a limb at a joint", opts: ["Straightening a limb", "Moving away from midline", "Rotating a limb"]},
        {id: 94, q: "Extension is defined as:", a: "Straightening a limb at a joint", opts: ["Bending a limb", "Moving toward midline", "Turning palm up"]},
        {id: 95, q: "Abduction is moving a limb:", a: "Away from the midline", opts: ["Toward the midline", "In a circle", "Backward"]},
        {id: 96, q: "Adduction is moving a limb:", a: "Toward the midline", opts: ["Away from the midline", "Upward", "Downward"]},
        {id: 97, q: "Pronation is turning the forearm so the palm is:", a: "Down", opts: ["Up", "Sideways", "Vertical"]},
        {id: 98, q: "Supination is turning the forearm so the palm is:", a: "Up", opts: ["Down", "Backward", "Inward"]},
        {id: 99, q: "Circumduction is:", a: "Moving the arm in a circle around the shoulder", opts: ["Bending the elbow", "Twisting the wrist", "Shrugging shoulders"]},
        {id: 100, q: "Inversion is moving the sole of the foot:", a: "Inward", opts: ["Outward", "Upward", "Downward"]},
        {id: 101, q: "Eversion is moving the sole of the foot:", a: "Outward", opts: ["Inward", "Upward", "Downward"]},
        {id: 102, q: "Protraction is moving a body part:", a: "Forward parallel to ground", opts: ["Backward", "Up", "Down"]},
        {id: 103, q: "Retraction is moving a body part:", a: "Backward parallel to ground", opts: ["Forward", "Up", "Down"]},
        {id: 104, q: "Elevation is:", a: "Raising a body part", opts: ["Lowering a body part", "Rotating a body part", "Bending a body part"]},
        {id: 105, q: "Depression is:", a: "Lowering a body part", opts: ["Raising a body part", "Extending a body part", "Flexing a body part"]},
        {id: 106, q: "Rotation is:", a: "Moving the head around a central axis", opts: ["Bending the neck", "Looking up", "Looking down"]},
        {id: 107, q: "Ballottement of the Patella is used to detect:", a: "Large amounts of fluid in the knee", opts: ["Fractures", "Ligament tears", "Muscle strain"]},
        {id: 108, q: "In the Ballottement test, you push the patella:", a: "Sharply against the femur", opts: ["Gently upwards", "To the side", "Down the tibia"]},
        {id: 109, q: "Hypopigmentation is the opposite of:", a: "Hyperpigmentation", opts: ["Erythema", "Cyanosis", "Jaundice"]},
        {id: 110, q: "Seborrhea is to Oily as Xerosis is to:", a: "Dry", opts: ["Wet", "Red", "Blue"]},
        {id: 111, q: "A loss of color due to lack of melanin is:", a: "Hypopigmentation", opts: ["Hyperpigmentation", "Jaundice", "Rubor"]},
        {id: 112, q: "Excessive hair growth in females following a male pattern is:", a: "Hirsutism", opts: ["Alopecia", "Vitiligo", "Pruritus"]},
        {id: 113, q: "Hyperthermia is associated with increased:", a: "Metabolic rate", opts: ["Blood pressure only", "Fluid intake", "Sleep"]},
        {id: 114, q: "Which skin color change suggests systemic disease?", a: "Generalized color change", opts: ["Localized bruise", "Sunburn", "Insect bite"]},
        {id: 115, q: "Which gland is inspected by swallowing water?", a: "Thyroid", opts: ["Parotid", "Adrenal", "Thymus"]},
        {id: 116, q: "Orthopnea is a specific type of:", a: "Dyspnea", opts: ["Apnea", "Arrhythmia", "Murmur"]},
        {id: 117, q: "The ratio of AP to Transverse diameter in a normal adult is:", a: "Less than 1 (0.70-0.75)", opts: ["Greater than 1", "Equal to 1", "2:1"]},
        {id: 118, q: "Air trapped in the lungs (Hyperinflation) causes which percussion sound?", a: "Hyperresonance", opts: ["Dullness", "Flatness", "Stony Dullness"]},
        {id: 119, q: "The Sternal Angle is a landmark for locating:", a: "2nd rib / JVP", opts: ["Xiphoid process", "7th rib", "Apex of heart"]},
        {id: 120, q: "Diastolic filling sounds (S3, S4) are low pitched, best heard with the:", a: "Bell", opts: ["Diaphragm", "Unassisted ear", "Doppler"]},
        {id: 121, q: "Rebound tenderness (Blumberg sign) is associated with:", a: "Appendicitis/Peritoneal inflammation", opts: ["Gas", "Constipation", "Normal finding"]},
        {id: 122, q: "To assess kidney tenderness, use:", a: "Indirect fist percussion", opts: ["Deep palpation", "Light touch", "Auscultation"]},
        {id: 123, q: "Moving a limb away from the body's midline is:", a: "Abduction", opts: ["Adduction", "Flexion", "Extension"]},
        {id: 124, q: "Checking for 'Clubbing' involves looking at the:", a: "Fingernails", opts: ["Toes only", "Ears", "Nose"]},
        {id: 125, q: "A 'Thrill' is to the heart what a '____' is to an artery.", a: "Bruit", opts: ["Murmur", "Click", "Snap"]},
        {id: 126, q: "Capillary refill time greater than 2 seconds suggests:", a: "Poor perfusion/Dehydration", opts: ["Normal finding", "Hypertension", "Fever"]},
        {id: 127, q: "The valve located at the 2nd Left Interspace is the:", a: "Pulmonic", opts: ["Aortic", "Tricuspid", "Mitral"]},
        {id: 128, q: "The valve located at the 5th Interspace MCL is the:", a: "Mitral", opts: ["Tricuspid", "Pulmonic", "Aortic"]},
        {id: 129, q: "S1 coincides with the pulse in the:", a: "Carotid artery", opts: ["Radial artery", "Femoral artery", "Pedal artery"]},
        {id: 130, q: "Which organ is in the LUQ?", a: "Spleen", opts: ["Liver", "Appendix", "Gallbladder"]}
    ];

    let state = {
        mode: 'menu', questions: [], index: 0, score: 0, streak: 0, 
        xp: 0, level: 1, mastery: {}, badges: {speedster:false, streak5:false, streak10:false, survivor:false}
    };
    
    let timerRef;
    let isTTS = false;
    
    // --- INIT ---
    function init() {
        const saved = localStorage.getItem('amer_scifi_data');
        if(saved) {
            let p = JSON.parse(saved);
            state.xp = p.xp || 0; state.level = p.level || 1;
            state.mastery = p.mastery || {}; state.badges = p.badges || state.badges;
        }
        renderMenu();
        updateUI();
        initCursor();
    }
    
    function save() {
        localStorage.setItem('amer_scifi_data', JSON.stringify({
            xp: state.xp, level: state.level, mastery: state.mastery, badges: state.badges
        }));
    }
    
    function resetData() {
        if(confirm("PURGE SYSTEM DATABASE?")) {
            localStorage.removeItem('amer_scifi_data');
            location.reload();
        }
    }

    // --- RENDERERS ---
    const app = document.getElementById('app-area');

    function renderMenu() {
        clearInterval(timerRef);
        state.mode = 'menu';
        app.innerHTML = `
            <div style="text-align:center;">
                <h2 style="color:var(--holo-cyan); font-family:var(--font-tech); margin-bottom:10px;">SELECT MODULE</h2>
                
                <div style="display:flex; gap:10px; max-width:400px; margin:0 auto 20px auto;">
                    <div style="flex:1;">
                        <div style="font-size:0.8rem; color:var(--text-dim); text-align:left;">DATASET SIZE</div>
                        <select id="q-count"><option value="25">25 UNITS</option><option value="50">50 UNITS</option><option value="all">FULL DATABASE</option></select>
                    </div>
                    <div style="flex:1;">
                        <div style="font-size:0.8rem; color:var(--text-dim); text-align:left;">TIMER (SEC)</div>
                        <input type="number" id="t-limit" value="15" min="5">
                    </div>
                </div>

                <div class="grid-menu">
                    <button class="tech-btn" onclick="start('practice')">PRACTICE MODULE</button>
                    <button class="tech-btn" onclick="start('smart')" style="border-color:var(--gold); color:var(--gold);">SMART ANALYSIS</button>
                    <button class="tech-btn" onclick="start('challenge')">TIME CHALLENGE</button>
                    <button class="tech-btn" onclick="start('flashcard')">DATA CARDS</button>
                </div>
            </div>
        `;
        drawPet('neutral');
    }

    window.start = function(mode) {
        state.mode = mode;
        state.index = 0; state.score = 0; state.streak = 0;
        
        let limit = document.getElementById('q-count') ? document.getElementById('q-count').value : '25';
        limit = limit === 'all' ? 9999 : parseInt(limit);
        
        let qSet = [...rawData];
        if(mode === 'smart') {
            qSet.sort((a,b) => (state.mastery[a.id]||0) - (state.mastery[b.id]||0));
        } else {
            qSet.sort(() => Math.random() - 0.5);
        }
        state.questions = qSet.slice(0, limit);
        
        if(mode === 'challenge') {
            state.timeLeft = document.getElementById('t-limit') ? parseInt(document.getElementById('t-limit').value) : 15;
        }
        
        renderQuestion();
    }

    function renderQuestion() {
        if(state.index >= state.questions.length) { renderEnd(); return; }
        
        let q = state.questions[state.index];
        let opts = [...q.opts, q.a].sort(() => Math.random() - 0.5);
        
        window.speechSynthesis.cancel();
        if(isTTS) speak(q.q);

        if(state.mode === 'flashcard') {
            renderCard(q);
        } else {
            renderQuiz(q, opts);
        }
    }

    function renderQuiz(q, opts) {
        let timerUI = state.mode === 'challenge' ? `<div style="width:100%; height:4px; background:#0f172a; margin-bottom:20px;"><div id="t-bar" style="height:100%; background:var(--alert-red); width:100%;"></div></div>` : '';
        let aladdinBtn = (['practice','challenge','smart'].includes(state.mode)) ? 
            `<button class="tech-btn" style="padding:10px; font-size:0.8rem; border-color:var(--gold); color:var(--gold);" onclick="magic('${q.a.replace(/'/g,"\\'")}')">GENIE PROTOCOL</button>` : '';

        app.innerHTML = `
            ${timerUI}
            <div style="display:flex; justify-content:space-between; color:var(--holo-cyan); font-family:var(--font-tech); font-size:0.8rem; margin-bottom:15px;">
                <span>SEQ: ${state.index+1} / ${state.questions.length}</span>
                <span>MODE: ${state.mode.toUpperCase()}</span>
            </div>
            <div class="q-display">${q.q}</div>
            <div id="opts-area">
                ${opts.map((o,i) => `<button class="opt-btn" onclick="check(this, '${o.replace(/'/g,"\\'")}','${q.a.replace(/'/g,"\\'")}', ${q.id})"><span style="color:var(--holo-cyan); margin-right:15px; font-weight:bold;">0${i+1}</span> ${o}</button>`).join('')}
            </div>
            <div style="display:flex; gap:15px; margin-top:30px;">
                <button class="tech-btn danger" style="padding:10px; font-size:0.8rem;" onclick="renderMenu()">ABORT</button>
                <div style="flex-grow:1;"></div>
                ${aladdinBtn}
                <button class="tech-btn" style="padding:10px; font-size:0.8rem;" onclick="next()">SKIP >></button>
            </div>
        `;
        
        if(state.mode === 'challenge') startTimer();
        drawPet('thinking');
        document.getElementById('pet-mood').innerText = "ANALYZING";
    }

    function renderCard(q) {
        app.innerHTML = `
            <div style="text-align:center; height:100%; display:flex; flex-direction:column; justify-content:center;">
                <div style="font-family:var(--font-tech); color:var(--holo-cyan); margin-bottom:20px;">DATA CARD ${state.index+1}</div>
                <div onclick="this.classList.toggle('flipped')" style="cursor:pointer; perspective:1000px; width:100%; height:300px;">
                    <div style="position:relative; width:100%; height:100%; transition:transform 0.6s; transform-style:preserve-3d;" id="card-inner">
                        <div style="position:absolute; width:100%; height:100%; backface-visibility:hidden; background:rgba(6,182,212,0.1); border:1px solid var(--holo-cyan); display:flex; align-items:center; justify-content:center; padding:30px; font-size:1.3rem;">
                            ${q.q}
                            <div style="position:absolute; bottom:10px; font-size:0.7rem; color:var(--text-dim);">[ CLICK TO DECRYPT ]</div>
                        </div>
                        <div style="position:absolute; width:100%; height:100%; backface-visibility:hidden; background:var(--holo-cyan); color:#000; transform:rotateY(180deg); display:flex; align-items:center; justify-content:center; padding:30px; font-size:1.4rem; font-weight:bold;">
                            ${q.a}
                        </div>
                    </div>
                </div>
                <style>.flipped #card-inner { transform: rotateY(180deg); }</style>
                <div style="margin-top:30px; display:flex; gap:20px; justify-content:center;">
                    <button class="tech-btn danger" style="padding:10px;" onclick="renderMenu()">EXIT</button>
                    <button class="tech-btn" style="padding:10px;" onclick="next()">NEXT DATA >></button>
                </div>
            </div>
        `;
        drawPet('neutral');
    }

    window.check = function(btn, sel, cor, id) {
        clearInterval(timerRef);
        document.querySelectorAll('.opt-btn').forEach(b => b.disabled=true);
        
        if(sel === cor) {
            btn.classList.add('correct');
            state.score++; state.streak++;
            state.mastery[id] = Math.min((state.mastery[id]||0)+1, 5);
            addXP(100 + (state.streak*10));
            drawPet('happy');
            if(isTTS) speak("Affirmative.");
        } else {
            btn.classList.add('wrong');
            state.streak = 0;
            state.mastery[id] = Math.max((state.mastery[id]||0)-2, -5);
            document.querySelectorAll('.opt-btn').forEach(b => {
                if(b.innerText.includes(cor)) b.classList.add('correct');
            });
            drawPet('sad');
            if(isTTS) speak("Negative. Correct answer identified.");
        }
        
        checkBadges();
        save();
        updateUI();
        setTimeout(next, 2000);
    }

    window.magic = function(cor) {
        let btns = Array.from(document.querySelectorAll('.opt-btn'));
        let wrongs = btns.filter(b => !b.innerText.includes(cor));
        if(wrongs.length >= 2) {
            for(let i=0; i<2; i++) {
                let r = Math.floor(Math.random()*wrongs.length);
                wrongs[r].classList.add('dimmed');
                wrongs.splice(r,1);
            }
            if(!state.badges.survivor) { state.badges.survivor=true; save(); updateUI(); }
        }
    }

    window.next = function() { state.index++; renderQuestion(); }

    function renderEnd() {
        clearInterval(timerRef);
        app.innerHTML = `
            <div style="text-align:center;">
                <div style="font-size:3rem; color:var(--success-green); font-family:var(--font-tech);">SESSION COMPLETE</div>
                <div style="font-size:5rem; font-weight:bold; margin:20px 0; color:white; text-shadow:0 0 20px var(--holo-cyan);">${state.score} / ${state.questions.length}</div>
                <button class="tech-btn" onclick="renderMenu()">RETURN TO ROOT</button>
            </div>
        `;
        startConfetti();
        drawPet('happy');
    }

    // --- UTILS ---
    function startTimer() {
        let t = state.timeLeft;
        let bar = document.getElementById('t-bar');
        if(!bar) return;
        bar.style.transition = `width ${t}s linear`;
        setTimeout(() => bar.style.width = '0%', 10);
        timerRef = setInterval(() => {
            t--;
            if(t<=0) { clearInterval(timerRef); document.querySelectorAll('.opt-btn').forEach(b=>b.disabled=true); drawPet('sad'); setTimeout(next,1500); }
        }, 1000);
    }

    function addXP(n) {
        state.xp += n;
        if(state.xp >= state.level*1000) { state.level++; state.xp=0; }
        updateUI();
    }

    function checkBadges() {
        if(state.streak >= 5 && !state.badges.streak5) state.badges.streak5 = true;
        if(state.streak >= 10 && !state.badges.streak10) state.badges.streak10 = true;
    }

    function updateUI() {
        document.getElementById('level-num').innerText = state.level;
        document.getElementById('xp-num').innerText = state.xp;
        let pct = (state.xp / (state.level*1000)) * 100;
        document.getElementById('xp-fill').style.width = pct+'%';
        
        let area = document.getElementById('badge-area');
        area.innerHTML = '';
        let bList = [
            {id:'streak5', ic:'🔥'}, {id:'streak10', ic:'🎯'}, {id:'survivor', ic:'🧞'}
        ];
        bList.forEach(b => {
            let d = document.createElement('div');
            d.className = `badge-slot ${state.badges[b.id] ? 'unlocked' : ''}`;
            d.innerText = b.ic;
            area.appendChild(d);
        });
    }

    function speak(txt) {
        let u = new SpeechSynthesisUtterance(txt);
        u.rate = 1.2; u.pitch = 0.9;
        window.speechSynthesis.speak(u);
    }

    window.toggleFullScreen = function() {
        if(!document.fullscreenElement) document.documentElement.requestFullscreen();
        else if(document.exitFullscreen) document.exitFullscreen();
    }

    document.getElementById('tts-toggle').addEventListener('change', e => isTTS = e.target.checked);

    // --- CANVAS DRAWING ---
    const pCtx = document.getElementById('pet-canvas').getContext('2d');
    function drawPet(mood) {
        pCtx.clearRect(0,0,140,140);
        let color = mood==='happy' ? '#10b981' : mood==='sad' ? '#ef4444' : '#06b6d4';
        
        pCtx.strokeStyle = color; pCtx.lineWidth = 3;
        
        // Rings
        pCtx.beginPath(); pCtx.arc(70,70,60,0,Math.PI*2); pCtx.stroke();
        pCtx.beginPath(); pCtx.arc(70,70,40,0,Math.PI*2); pCtx.stroke();
        
        // Core
        pCtx.fillStyle = color;
        pCtx.beginPath(); pCtx.arc(70,70,15,0,Math.PI*2); pCtx.fill();
        
        // Data bits
        if(mood === 'thinking') {
             pCtx.fillStyle = '#fff';
             pCtx.font = "10px monospace";
             pCtx.fillText("PROCESSING...", 35, 74);
        }
        
        let t = document.getElementById('pet-mood');
        if(t) {
            t.innerText = mood.toUpperCase();
            t.style.color = color;
        }
    }

    // --- CONFETTI ---
    function startConfetti() {
        const c = document.getElementById('confetti-c');
        const cx = c.getContext('2d');
        c.width = window.innerWidth; c.height = window.innerHeight;
        let ps = [];
        for(let i=0; i<100; i++) ps.push({x:Math.random()*c.width, y:Math.random()*c.height-c.height, c:`hsl(${Math.random()*360},100%,50%)`, v:Math.random()*5+2});
        function loop() {
            cx.clearRect(0,0,c.width,c.height);
            ps.forEach(p => { p.y+=p.v; cx.fillStyle=p.c; cx.fillRect(p.x,p.y,5,5); });
            requestAnimationFrame(loop);
        }
        loop();
    }

    // --- CURSOR ---
    function initCursor() {
        let dot = document.getElementById('cursor-dot');
        let ring = document.getElementById('cursor-ring');
        document.addEventListener('mousemove', e => {
            dot.style.left = e.clientX+'px'; dot.style.top = e.clientY+'px';
            ring.style.left = e.clientX+'px'; ring.style.top = e.clientY+'px';
        });
        document.addEventListener('mousedown', () => ring.style.transform = "translate(-50%, -50%) scale(0.8)");
        document.addEventListener('mouseup', () => ring.style.transform = "translate(-50%, -50%) scale(1)");
    }

    init();
</script>
</body>
